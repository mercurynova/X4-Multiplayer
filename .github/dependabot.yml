version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Google.FlatBuffers must move in lockstep with the pinned flatc (tools/flatc/flatc.lock.json,
      # ADR-041): bump both together by hand, never via Dependabot.
      - dependency-name: "Google.FlatBuffers"
      # Deferred major (docs/backlog.md D2): remove this entry when the xunit runner 4 upgrade is picked up.
      - dependency-name: "xunit.runner.visualstudio"
        update-types: ["version-update:semver-major"]
      # Deferred major (docs/backlog.md D3): the .NET 11 package set. The app targets net10.0 (global.json
      # pins SDK 10.0.4xx), so an 11.x library is a framework decision, not a bump; patches (10.0.x) keep
      # coming through the nuget-minor-patch group. Remove these entries when the net11.0 move is picked up.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.NET.ILLink.Tasks"
        update-types: ["version-update:semver-major"]
      # SQLitePCLRaw moves with Microsoft.Data.Sqlite (3.x came in with its 11.0.0): same decision.
      - dependency-name: "SQLitePCLRaw.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/server/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Deferred major (docs/backlog.md D1): remove this entry when the TypeScript 7 upgrade is picked up.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
