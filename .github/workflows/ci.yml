# CI for X4MP (M0-16). This workflow is the MERGE GATE (docs/execution-plan.md section 3.4): the repo is public (GPL-3.0),
# GitHub-hosted runners (Windows included) are free, so every PR and every push to main runs every job. The single
# required status check is `ci-ok` (the last job): it passes only when every job passed or was skipped, so branch
# protection needs just that one name. Do not rename it.
# The only shortcut: a docs-only change (see the `changes` job for the exact rule) skips the heavy jobs; `ci-ok` still passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      everything:
        description: "Run every job (a manual dispatch always does, there is no diff to inspect; kept as an explicit switch)"
        type: boolean
        default: true

# A newer push to the same PR/branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  # ---------------------------------------------------------------------------------------------
  # Decide only one thing: is this a docs-only change (heavy jobs may be skipped)? Plain git + grep.
  # DOCS-ONLY = the diff is non-empty and EVERY changed file matches  ^docs/ | ^\.claude/ | ^LICENSE$ | \.md$
  # and none is under .github/. Anything else (code, scripts, protocol, tools, props, anything under .github/)
  # is not docs-only. Unknown diff (new branch / force-push, git diff failure, empty list), workflow_dispatch
  # and scheduled runs all run everything.
  # ---------------------------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.f.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          heavy=true
          files=""
          known=false
          if [ "$EVENT" = "pull_request" ]; then
            if files="$(git diff --name-only "$PR_BASE...$PR_HEAD")"; then known=true; fi
          elif [ "$EVENT" = "push" ]; then
            # a new branch or force-push has an unknown before-sha: run everything
            if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              if files="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER")"; then known=true; fi
            fi
          fi
          # workflow_dispatch / schedule: known stays false -> everything
          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          if [ "$known" = true ] && [ -n "$files" ]; then
            other="$(echo "$files" | grep -Ev '^(docs/|\.claude/|LICENSE$)|\.md$' || true)"
            gh_files="$(echo "$files" | grep -E '^\.github/' || true)"
            if [ -z "$other" ] && [ -z "$gh_files" ]; then heavy=false; fi
          fi
          echo "docs-only change: $([ "$heavy" = false ] && echo yes || echo no)"
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------
  web:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------------------------------------
  # .NET on ubuntu and windows for every PR and push.
  # The web build is skipped (-p:SkipWebBuild=true): the server embeds a placeholder page, and the
  # real GUI is covered by the `web` job and the release build.
  # ---------------------------------------------------------------------------------------------
  dotnet:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Cache flatc
        uses: actions/cache@v6
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      - name: Fetch flatc (Linux)
        if: runner.os == 'Linux'
        run: bash tools/flatc/fetch-flatc.sh
      - name: Fetch flatc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/flatc/fetch-flatc.ps1
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore -warnaserror -p:SkipWebBuild=true
      # Wall-clock / load-sensitive tests are [Trait("Category","Perf")]: excluded here, run by nightly.yml.
      # -m:1 runs the test PROJECTS one after the other. The Server.Tests "live" tests (real server + FakeNode clients, real ping/heartbeat
      # timeouts, a synchronous PRAGMA synchronous=FULL ledger commit on the session actor thread) stalled for 3-11 s on the Windows runner whenever
      # X4MP.Persistence.Tests (fsync-heavy, 5-6 min there vs 50 s on Linux) ran beside them. Do not remove it or raise the timeouts.
      - run: dotnet test -c Release --no-build -m:1 -p:SkipWebBuild=true --filter "Category!=Perf" --logger "trx;LogFileName=results.trx" --results-directory TestResults
      # M3-13: the SaveScan CLI on the synthetic fixture saves (gzipped here like X4 writes them): clean = 0, an authority checkpoint with its
      # avatars = 0, a client quicksave full of ghosts = exactly 1 (leftovers found).
      - name: SaveScan on the synthetic fixtures
        shell: bash
        run: |
          set -u
          fx=tools/X4MP.SaveScan.Tests/fixtures
          dll=tools/X4MP.SaveScan/bin/Release/net10.0/X4MP.SaveScan.dll
          out="$RUNNER_TEMP/savescan"
          mkdir -p "$out"
          for f in clean authority-checkpoint client-quicksave; do gzip -c "$fx/$f.xml" > "$out/$f.xml.gz"; done
          dotnet "$dll" "$out/clean.xml.gz" --json "$out/clean.json"
          dotnet "$dll" "$out/authority-checkpoint.xml.gz" --avatar-owner team --expect-avatar AVA-001 --expect-avatar AVA-002
          set +e
          dotnet "$dll" "$out/client-quicksave.xml.gz" --expect-avatar AVA-001 --avatar-owner player
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then echo "expected exit code 1 (leftovers) for the client quicksave fixture, got $rc"; exit 1; fi
          test -s "$out/clean.json"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  protocol-cpp:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-archives
    steps:
      - uses: actions/checkout@v7
      - name: Cache flatc
        uses: actions/cache@v6
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-archives
          key: vcpkg-protocol-${{ runner.os }}-${{ hashFiles('protocol/cpp/vcpkg.json') }}
          restore-keys: vcpkg-protocol-${{ runner.os }}-
      - name: Create vcpkg cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - run: powershell -NoProfile -File protocol/cpp/build.ps1
      - name: Upload CTest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-cpp-logs
          path: protocol/cpp/build/**/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  mod:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-archives
    steps:
      - uses: actions/checkout@v7
      - name: Cache flatc
        uses: actions/cache@v6
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-archives
          key: vcpkg-mod-${{ runner.os }}-${{ hashFiles('mod/vcpkg.json') }}
          restore-keys: vcpkg-mod-${{ runner.os }}-
      - name: Create vcpkg cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      # Builds x4mp.dll, runs the Catch2 tests, the raw-remove guard and the packaging check (all via ctest).
      - run: powershell -NoProfile -File mod/build.ps1
      - name: Upload CTest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mod-logs
          path: mod/build/**/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Cheap static checks on the extension files (ubuntu, seconds).
  # ---------------------------------------------------------------------------------------------
  mod-lint:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: XML well-formedness (mod/extension)
        run: |
          python3 -c "import glob, xml.dom.minidom as m; fs = sorted(glob.glob('mod/extension/**/*.xml', recursive=True)); [(print(f), m.parse(f)) for f in fs]; print('well-formed:', len(fs), 'files')"
      - name: Lua unit tests (mod/tests/lua)
        run: |
          sudo apt-get install -y --no-install-recommends lua5.1 >/dev/null
          sh mod/tests/lua/run.sh --require
      - name: Detect Lua files
        id: lua
        run: |
          if [ -n "$(find mod/extension -name '*.lua' -print -quit)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No .lua files under mod/extension; skipping luacheck."
          fi
      - name: luacheck
        if: steps.lua.outputs.present == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends luarocks >/dev/null
          sudo luarocks install luacheck >/dev/null
          luacheck mod/extension --config mod/extension/x4mp/.luacheckrc --no-color

  # ---------------------------------------------------------------------------------------------
  # End-to-end (M1-C1). The same script runs locally: `pwsh tools/e2e.ps1` (docs/dev-setup.md section 10).
  # Two ubuntu jobs in parallel, each publishing the linux-x64 single-file server (Release):
  #   swarm:      server on a temp data dir, bootstrap password change over the API, `fakenode swarm --with-authority
  #               --teams 3 --relations ffa --economy casual --dupe-attack --verify --admin-url ...`, any non-zero
  #               exit (drift, duplicate effect, invariant failure) fails the job.
  #   playwright: the Playwright suite (Chromium) against the published server exe.
  # plus a windows job (e2e-headless, E7: a matrix of 4 shards in parallel, see below) with the C++ x4mp-headless client (handshake, heartbeat, resume, save download) and
  # x4mp-hostsim (M2-01: the real x4mp.dll in a fake X4Native host against the real server; scenarios in mod/tests/hostsim:
  # smoke, join flow, reload survival, authority flow, mod refusal) and the M2-08 live authority upload kill test (ports 47980-47983).
  # ---------------------------------------------------------------------------------------------
  e2e:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: swarm
            steps: Publish,Swarm
          - name: playwright
            steps: Publish,Playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Cache flatc
        uses: actions/cache@v6
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      - uses: actions/setup-node@v7
        if: matrix.name == 'playwright'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - name: Cache Playwright browsers
        if: matrix.name == 'playwright'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('server/web/package-lock.json') }}
      - name: E2E (${{ matrix.steps }})
        shell: pwsh
        run: ./tools/e2e.ps1 -Steps ${{ matrix.steps }}
      - name: Upload E2E logs and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.name }}-logs
          path: |
            out/e2e/summary.md
            out/e2e/logs
            out/e2e/playwright-test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-headless:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    name: e2e-headless (${{ matrix.name }})
    runs-on: windows-latest
    timeout-minutes: 30
    # E7: the 15 steps (~34 min serial) are split into 4 shards that run in parallel, balanced by measured step time (CI run
    # 39603793368). Step seconds below EXCLUDE the mod build: the old "Headless 468 s" was the ~7 min cold mod build (the client itself
    # runs ~10 s), tools/e2e.ps1 attributes the build to the first mod step of a run. Every shard pays Publish (~100 s) plus its own mod
    # build (warm vcpkg cache: ~1-2 min), then its steps, so a shard is about 8-13 min wall (the old job: 34 min).
    # Each shard is self-sufficient: tools/e2e.ps1 runs Publish first and builds the mod itself (Ensure-ModBuild). The steps use their own
    # port ranges and every shard is its own machine, so nothing is shared between shards. ReloadSurvival is deliberately NOT in the
    # shard with HostSimM3 (known flaky interaction, docs/backlog.md Flaky tests).
    # `ci-ok` needs `e2e-headless`: the result of a matrix job is the aggregate of its shards.
    strategy:
      fail-fast: false
      matrix:
        include:
          # ~355 s: HostSimAvatars [345] + Headless [10]
          - name: avatars
            steps: Publish,Headless,HostSimAvatars
          # ~295 s: AuthorityFlow [165] + HostSimGhosts [128]
          - name: authority
            steps: Publish,AuthorityFlow,HostSimGhosts
          # ~315 s: UploadKill [116] + HostSimM3 [~110] + JoinFlow [88]
          - name: m3
            steps: Publish,HostSimM3,UploadKill,JoinFlow
          # ~275 s: HostSimPair [86] + ReloadSurvival [47] + Session4Kit [46] + UdpLane [43] + LaunchStats [22] + ModRefusal [19] + HostSim [14]
          - name: misc
            steps: Publish,HostSimPair,ReloadSurvival,Session4Kit,UdpLane,LaunchStats,ModRefusal,HostSim
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-archives
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Cache flatc
        uses: actions/cache@v6
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      # Same cache key as the `mod` job, so a warm cache makes the mod build here a few minutes.
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-archives
          key: vcpkg-mod-${{ runner.os }}-${{ hashFiles('mod/vcpkg.json') }}
          restore-keys: vcpkg-mod-${{ runner.os }}-
      - name: Create vcpkg cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      # M3-14: HostSimAvatars (real authority + bots), HostSimM3 (two real DLLs: authority + client, 6 bots; perf / bandwidth / log rate through
      # tools/session4/sync-report.ps1), UdpLane (UDP lane forced / loss / blocked / fallback) and Session4Kit (every session-4 kit script).
      - name: E2E (${{ matrix.steps }})
        shell: pwsh
        run: ./tools/e2e.ps1 -Steps ${{ matrix.steps }}
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-headless-logs-${{ matrix.name }}
          path: |
            out/e2e/summary.md
            out/e2e/logs
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # The single required check (branch protection requires `ci-ok`). Fails if any job failed or was
  # cancelled; passes when every job succeeded or was skipped (a docs-only change skips the heavy jobs).
  # `if: always()` so it still reports when a needed job fails.
  # ---------------------------------------------------------------------------------------------
  ci-ok:
    name: ci-ok
    needs: [changes, web, dotnet, protocol-cpp, mod, mod-lint, e2e, e2e-headless]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check needed job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "A required job failed or was cancelled."; exit 1
          fi
          echo "All jobs succeeded or were skipped."
