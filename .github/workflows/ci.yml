# CI for X4MP (M0-16). Kept LEAN on purpose: the repo is private, so Actions minutes are limited
# (Windows minutes bill at 2x, macOS is never used). Every heavy job is gated on changed paths,
# so a docs-only change runs only the tiny `changes` job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR/branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  VCPKG_DISABLE_METRICS: "1"

jobs:
  # ---------------------------------------------------------------------------------------------
  # Decide which heavy jobs are needed from the changed files. Plain git + grep (no third-party
  # action). workflow_dispatch, a new branch push and a changed ci.yml run everything.
  # ---------------------------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.f.outputs.web }}
      dotnet: ${{ steps.f.outputs.dotnet }}
      protocol_cpp: ${{ steps.f.outputs.protocol_cpp }}
      mod: ${{ steps.f.outputs.mod }}
      e2e: ${{ steps.f.outputs.e2e }}
      e2e_win: ${{ steps.f.outputs.e2e_win }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          all=false
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only "$PR_BASE...$PR_HEAD")" || all=true
          elif [ "$EVENT" = "push" ]; then
            if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              files="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER")" || all=true
            else
              all=true   # new branch or force-push: the before-sha is unknown
            fi
          else
            all=true     # workflow_dispatch
          fi
          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          has() { if echo "$files" | grep -Eq "$1"; then echo true; else echo false; fi; }
          # A change to ci.yml runs everything, so CI edits are validated by CI.
          if [ "$(has '^\.github/workflows/ci\.yml$')" = true ]; then all=true; fi

          web=$(has '^server/web/')
          dotnet=$(has '^(server/|tools/X4MP\.|tools/flatc/|protocol/|Directory\..*\.props$|global\.json$|X4MP\.sln$)')
          protocol_cpp=$(has '^(protocol/|tools/flatc/)')
          # mod/spikes/** alone must not trigger the mod job.
          if echo "$files" | grep -Ev '^mod/spikes/' | grep -Eq '^(mod/|protocol/|tools/flatc/)'; then mod=true; else mod=false; fi
          # E2E (M1-C1): the ubuntu jobs (swarm, Playwright) need the server, web, FakeNode, protocol or the script itself;
          # the windows headless-client job also needs the mod. mod/spikes/** alone triggers nothing.
          e2e=$(has '^(server/|protocol/|tools/X4MP\.|tools/flatc/|tools/e2e\.ps1$|Directory\..*\.props$|global\.json$)')
          if echo "$files" | grep -Ev '^mod/spikes/' | grep -Eq '^mod/'; then e2e_win=true; else e2e_win=$(has '^(server/src/|protocol/|tools/X4MP\.|tools/flatc/|tools/e2e\.ps1$)'); fi
          if [ "$EVENT" = "push" ]; then e2e=true; e2e_win=true; fi   # a push to main always runs the whole E2E
          if [ "$all" = true ]; then web=true; dotnet=true; protocol_cpp=true; mod=true; e2e=true; e2e_win=true; fi
          {
            echo "web=$web"; echo "dotnet=$dotnet"; echo "protocol_cpp=$protocol_cpp"
            echo "mod=$mod"; echo "e2e=$e2e"; echo "e2e_win=$e2e_win"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------------------------------------
  # .NET on ubuntu for every relevant change; windows only on push to main (2x billing).
  # The web build is skipped (-p:SkipWebBuild=true): the server embeds a placeholder page, and the
  # real GUI is covered by the `web` job and the release build.
  # ---------------------------------------------------------------------------------------------
  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      - name: Fetch flatc (Linux)
        if: runner.os == 'Linux'
        run: bash tools/flatc/fetch-flatc.sh
      - name: Fetch flatc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/flatc/fetch-flatc.ps1
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore -warnaserror -p:SkipWebBuild=true
      # Wall-clock / load-sensitive tests are [Trait("Category","Perf")]: excluded here, run by nightly.yml.
      - run: dotnet test -c Release --no-build -p:SkipWebBuild=true --filter "Category!=Perf" --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  protocol-cpp:
    needs: changes
    if: needs.changes.outputs.protocol_cpp == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-archives
    steps:
      - uses: actions/checkout@v7
      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-protocol-${{ runner.os }}-${{ hashFiles('protocol/cpp/vcpkg.json') }}
          restore-keys: vcpkg-protocol-${{ runner.os }}-
      - name: Create vcpkg cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - run: powershell -NoProfile -File protocol/cpp/build.ps1
      - name: Upload CTest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-cpp-logs
          path: protocol/cpp/build/**/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  mod:
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-archives
    steps:
      - uses: actions/checkout@v7
      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-mod-${{ runner.os }}-${{ hashFiles('mod/vcpkg.json') }}
          restore-keys: vcpkg-mod-${{ runner.os }}-
      - name: Create vcpkg cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      # Builds x4mp.dll, runs the Catch2 tests, the raw-remove guard and the packaging check (all via ctest).
      - run: powershell -NoProfile -File mod/build.ps1
      - name: Upload CTest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mod-logs
          path: mod/build/**/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Cheap static checks on the extension files (ubuntu, seconds). Runs with the mod job's trigger.
  # ---------------------------------------------------------------------------------------------
  mod-lint:
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: XML well-formedness (mod/extension)
        run: |
          python3 -c "import glob, xml.dom.minidom as m; fs = sorted(glob.glob('mod/extension/**/*.xml', recursive=True)); [(print(f), m.parse(f)) for f in fs]; print('well-formed:', len(fs), 'files')"
      - name: Lua unit tests (mod/tests/lua)
        run: |
          sudo apt-get install -y --no-install-recommends lua5.1 >/dev/null
          sh mod/tests/lua/run.sh --require
      - name: Detect Lua files
        id: lua
        run: |
          if [ -n "$(find mod/extension -name '*.lua' -print -quit)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No .lua files under mod/extension; skipping luacheck."
          fi
      - name: luacheck
        if: steps.lua.outputs.present == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends luarocks >/dev/null
          sudo luarocks install luacheck >/dev/null
          luacheck mod/extension --config mod/extension/x4mp/.luacheckrc --no-color

  # ---------------------------------------------------------------------------------------------
  # End-to-end (M1-C1). The same script runs locally: `pwsh tools/e2e.ps1` (docs/dev-setup.md section 10).
  # Two ubuntu jobs in parallel, each publishing the linux-x64 single-file server (Release):
  #   swarm:      server on a temp data dir, bootstrap password change over the API, `fakenode swarm --with-authority
  #               --teams 3 --relations ffa --economy casual --dupe-attack --verify --admin-url ...`, any non-zero
  #               exit (drift, duplicate effect, invariant failure) fails the job.
  #   playwright: the Playwright suite (Chromium) against the published server exe.
  # plus a windows job (e2e-headless) with the C++ x4mp-headless client (handshake, heartbeat, resume, save download) and
  # x4mp-hostsim (M2-01: the real x4mp.dll in a fake X4Native host against the real server; scenarios in mod/tests/hostsim).
  # ---------------------------------------------------------------------------------------------
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: swarm
            steps: Publish,Swarm
          - name: playwright
            steps: Publish,Playwright
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      - uses: actions/setup-node@v7
        if: matrix.name == 'playwright'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - name: Cache Playwright browsers
        if: matrix.name == 'playwright'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('server/web/package-lock.json') }}
      - name: E2E (${{ matrix.steps }})
        shell: pwsh
        run: ./tools/e2e.ps1 -Steps ${{ matrix.steps }}
      - name: Upload E2E logs and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.name }}-logs
          path: |
            out/e2e/summary.md
            out/e2e/logs
            out/e2e/playwright-test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-headless:
    needs: changes
    if: needs.changes.outputs.e2e_win == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-archives
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      # Same cache key as the `mod` job, so a warm cache makes the mod build here a few minutes.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-mod-${{ runner.os }}-${{ hashFiles('mod/vcpkg.json') }}
          restore-keys: vcpkg-mod-${{ runner.os }}-
      - name: Create vcpkg cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - name: E2E (Publish,Headless,HostSim)
        shell: pwsh
        run: ./tools/e2e.ps1 -Steps Publish,Headless,HostSim
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-headless-logs
          path: |
            out/e2e/summary.md
            out/e2e/logs
          if-no-files-found: ignore
          retention-days: 7
