# Release (M0-16, finished in M6): on a `v*` tag, build the win-x64 and linux-x64 single-file servers,
# the Windows launcher, the in-game bundle the mod starts from inside X4, and the mod package; write
# SHA256SUMS and create a DRAFT GitHub release. Not run on any PR; first real use is the first tag. TODO: SBOM (CycloneDX) per
# server-design 7.2 — it needs a tool step, not a project dependency, so it was left for the first
# tagged run to prove.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  server:
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - name: Fetch flatc (Linux)
        if: runner.os == 'Linux'
        run: bash tools/flatc/fetch-flatc.sh
      - name: Fetch flatc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/flatc/fetch-flatc.ps1
      # Release configuration builds the web GUI (npm ci + npm run build) and embeds it.
      - run: dotnet publish server/src/X4MP.Server -c Release -p:PublishProfile=${{ matrix.rid }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item docs/README-server.md "out/${{ matrix.rid }}/README.md"
          Compress-Archive -Path "out/${{ matrix.rid }}/*" -DestinationPath "dist/x4mp-server-$tag-${{ matrix.rid }}.zip"
      # tar.gz, not zip: a zip built on Windows carries no executable bit, so a Linux player would
      # have to chmod +x the server before the first start.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp docs/README-server.md "out/${{ matrix.rid }}/README.md"
          tar -czf "dist/x4mp-server-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" -C "out/${{ matrix.rid }}" .
      # The copy the mod starts from inside the game. It cannot be the single-file exe above: that one
      # is fine from a shell but has never been proven inside X4, and an R2R image dies there with
      # 0xC0000602 before it can print anything. See win-x64-bundle.pubxml.
      - name: Publish the in-game bundle (Windows)
        if: runner.os == 'Windows'
        run: dotnet publish server/src/X4MP.Server -c Release -p:PublishProfile=win-x64-bundle
      - name: Package the in-game bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "out/server-win-x64/*" -DestinationPath "dist/x4mp-server-$tag-win-x64-bundle.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.rid }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: server-bundle-win-x64
          path: dist/*-bundle.zip
          if-no-files-found: error
          retention-days: 3

  # The launcher a player runs before X4: x4mp-launcher.exe, single-file and self-contained so a
  # machine with no .NET install can start it. WPF, so windows-latest only; it lives outside
  # X4MP.sln for the same reason.
  launcher:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # X4MP.Protocol generates its flatbuffers types at build time, and the launcher references it.
      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      - name: Fetch flatc (Windows)
        shell: pwsh
        run: tools/flatc/fetch-flatc.ps1
      - run: dotnet publish launcher/X4MP.Launcher -c Release -p:PublishProfile=win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-win-x64
          path: out/launcher-win-x64/x4mp-launcher.exe
          if-no-files-found: error
          retention-days: 3

  mod:
    needs: [server, launcher]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-archives
    steps:
      - uses: actions/checkout@v7
      - name: Cache flatc
        uses: actions/cache@v4
        with:
          path: tools/flatc/bin
          key: flatc-${{ runner.os }}-${{ hashFiles('tools/flatc/flatc.lock.json') }}
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-archives
          key: vcpkg-mod-${{ runner.os }}-${{ hashFiles('mod/vcpkg.json') }}
          restore-keys: vcpkg-mod-${{ runner.os }}-
      - name: Create vcpkg cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
      - run: powershell -NoProfile -File mod/build.ps1 -Config release
      # The bundle the in-game menu starts (<X4>\extensions\x4mp\server). It ships inside the mod zip,
      # so one unzip gives a player both halves and the launcher finds the executable where it looks.
      - uses: actions/download-artifact@v4
        with:
          name: server-bundle-win-x64
          path: out/bundle-zip
      - name: Unpack the server bundle
        shell: pwsh
        run: Expand-Archive -Path (Get-ChildItem out/bundle-zip/*.zip).FullName -DestinationPath out/server-win-x64 -Force
      # The exe that reads the server's manifest and switches mods on or off. It sits at the top of
      # the zip, next to the installer scripts, because it is the second thing a player runs.
      - uses: actions/download-artifact@v4
        with:
          name: launcher-win-x64
          path: out/launcher
      - name: Package mod
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $x4n = 'mod/third_party/x4native/v9.0.0-611726'
          $root = "pkg/x4mp-mod-$tag"
          # Same layout as mod/tools/deploy.ps1: unzip into <X4>\extensions\ (Protected UI Mode must be off).
          $ext = "$root/extensions/x4mp"
          New-Item -ItemType Directory -Force "$ext/native" | Out-Null
          Copy-Item -Recurse -Force mod/extension/x4mp/* $ext
          Copy-Item mod/build/msvc-x64-release/x4mp.dll "$ext/native/x4mp.dll"
          Copy-Item -Recurse -Force out/server-win-x64 "$ext/server"
          $n = "$root/extensions/x4native"
          New-Item -ItemType Directory -Force $n | Out-Null
          Copy-Item -Recurse -Force "$x4n/x4native/*" $n
          Copy-Item "$x4n/LICENSE" "$n/LICENSE"
          Copy-Item "$x4n/VERSION" "$n/VERSION"
          # The four tools a player runs: the .bat files sit at the top of the zip, the PowerShell
          # behind them in installer\. They find the payload next to themselves. The test script
          # stays in the repo: it needs a checkout to build its fake tree from.
          Copy-Item installer/*.bat $root
          Copy-Item out/launcher/x4mp-launcher.exe $root
          New-Item -ItemType Directory -Force "$root/installer" | Out-Null
          Copy-Item installer/Common.ps1, installer/Install.ps1, installer/CheckInstall.ps1, `
            installer/CollectLogs.ps1, installer/Uninstall.ps1 "$root/installer"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$root/*" -DestinationPath "dist/x4mp-mod-$tag.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 3

  draft-release:
    needs: [server, mod]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum ./*.zip ./*.tar.gz | sed 's|\./||' | tee SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" dist/* --draft --generate-notes --title "${{ github.ref_name }}"
