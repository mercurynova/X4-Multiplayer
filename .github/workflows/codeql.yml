# CodeQL (M0-16). Weekly + on push to main only (never per PR) to save Actions minutes.
#
# NOTE: CodeQL on a PRIVATE repo needs GitHub Advanced Security. If it is not enabled, the upload step
# fails; this job is `continue-on-error`, so the run does not turn red. To disable entirely, either set the
# repository variable CODEQL_DISABLED=true (Settings > Secrets and variables > Actions > Variables) or
# disable this workflow in the Actions tab.
#
# TODO(C++): add a `cpp` entry (build-mode manual, `powershell -NoProfile -File mod/build.ps1 -NoTest`)
# on windows-latest once the minute budget allows; a cold vcpkg build makes it too costly for now.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    if: vars.CODEQL_DISABLED != 'true'
    continue-on-error: true
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Build (C#)
        if: matrix.language == 'csharp'
        run: |
          bash tools/flatc/fetch-flatc.sh
          dotnet build server/src/X4MP.Server -c Release -p:SkipWebBuild=true
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
